</div>
<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = p => 1 - Math.pow(1 - p, 3);

/* ---------- parts (drawn around their centre) ---------- */
function studs(p, w, y, n, fill) { for (let i = 0; i < n; i++) add(p, 'rect', { x: -w / 2 + (i + .5) * w / n - 22, y: y - 18, width: 44, height: 22, rx: 8, fill }); }

  add(b, 'rect', { x: -150, y: -240, width: 300, height: 26, fill: 'rgba(255,255,255,.18)' }); return b; }

const s1 = g();
const SHOPS = [[190, '#f5b915', 'PENCILS'], [540, '#2f8fd6', 'BOOKS'], [890, '#1fae5b', 'LUNCH']].map(([x, c, n]) => ({ s: shop(s1, c, n), x }));
const cal = g(s1); add(cal, 'rect', { x: -120, y: -80, width: 240, height: 170, rx: 18, fill: '#fff', stroke: '#1d2b3a', 'stroke-width': 6 });
add(cal, 'rect', { x: -120, y: -80, width: 240, height: 50, rx: 18, fill: '#ff6b4a' }); add(cal, 'rect', { x: -120, y: -50, width: 240, height: 20, fill: '#ff6b4a' });

const miss = [0, 1, 2].map(k => { const w = g(s1); add(w, 'rect', { x: -70, y: -90, width: 140, height: 180, rx: 16, fill: 'none', stroke: '#e03131', 'stroke-width': 6, 'stroke-dasharray': '16 12' });
  add(w, 'path', { d: 'M-28,-28 L28,28 M28,-28 L-28,28', stroke: '#e03131', 'stroke-width': 12, 'stroke-linecap': 'round' }); return w; });
const missP = [0, 1, 2].map(k => { const w = g(s1); const tx = 'NO ' + ITEM_NAME[k]; const ww = tx.length * 22 + 50;
  add(w, 'rect', { x: -ww / 2, y: -30, width: ww, height: 60, rx: 30, fill: '#e03131' }); add(w, 'text', { x: 0, y: 12, 'text-anchor': 'middle', style: 'font:900 32px Inter;fill:#fff' }, tx); return w; });
DAYS.forEach(d => { [0, 1, 2].forEach(k => { if (k !== d.missing) SFX.push({ t: d.at + .1 + k * .12, type: 'pop' }); }); SFX.push({ t: d.at + .45, type: 'clunk' }); });

/* ---------- kid ---------- */
const kid = g();
add(kid, 'circle', { cx: 0, cy: -150, r: 44, fill: '#fff', stroke: '#1d2b3a', 'stroke-width': 8 });
add(kid, 'circle', { cx: -15, cy: -158, r: 6, fill: '#1d2b3a' }); add(kid, 'circle', { cx: 15, cy: -158, r: 6, fill: '#1d2b3a' });
const kMouth = add(kid, 'path', { d: '', stroke: '#1d2b3a', 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round' });
add(kid, 'path', { d: 'M0,-106 V20 M0,20 L-36,110 M0,20 L36,110', stroke: '#1d2b3a', 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' });
const kArmL = add(kid, 'path', { d: '', stroke: '#1d2b3a', 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' });
const kArmR = add(kid, 'path', { d: '', stroke: '#1d2b3a', 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' });

/* ---------- scene 2: the bag arrives already packed, each item labelled ---------- */
const s2 = g();
const bag2 = g(s2); backpack(bag2, '#00203f');
const packedItems = [0, 1, 2].map(k => { const w = g(s2); ITEM[k](w); const tg = g(s2); const ww = ITEM_NAME[k].length * 22 + 50;
  add(tg, 'rect', { x: -ww / 2, y: -26, width: ww, height: 52, rx: 26, fill: ITEM_COL[k] }); add(tg, 'text', { x: 0, y: 11, 'text-anchor': 'middle', style: 'font:900 28px Inter;fill:#fff' }, ITEM_NAME[k]); return { w, tg }; });
const readyP = g(s2); { const tx = 'PACKED FOR YOU ✓', ww = tx.length * 28 + 60; add(readyP, 'rect', { x: -ww / 2, y: -34, width: ww, height: 68, rx: 34, fill: '#1fae5b' }); add(readyP, 'text', { x: 0, y: 13, 'text-anchor': 'middle', class: 'lbl' }, tx); }
SFX.push({ t: A(2.83), type: 'whoosh' }); SFX.push({ t: A(3.9), type: 'ding' });

/* ---------- scene 3: Razan — the same idea for your wardrobe ---------- */
const s3 = g();
const logoBlock = g(s3);
add(logoBlock, 'rect', { x: -230, y: -100, width: 460, height: 200, rx: 28, fill: '#fff', stroke: '#00203f', 'stroke-width': 6 });
add(logoBlock, 'image', { href: '../assets/logo.png', x: -235, y: -92, width: 470, height: 184, preserveAspectRatio: 'xMidYMid meet' });
studs(logoBlock, 460, -100, 4, '#e6ecf2');
const box = g(s3); add(box, 'rect', { x: -230, y: -150, width: 460, height: 300, rx: 16, fill: '#c79a6b', stroke: '#8a6a4a', 'stroke-width': 6 });
add(box, 'rect', { x: -230, y: -150, width: 460, height: 70, fill: '#b4875a' }); add(box, 'rect', { x: -26, y: -150, width: 52, height: 300, fill: '#e8d3bd' });
sticker(box, 150, 40);
const PARTS = [[frameBlock, 250, 1020, 'FRAME', '#5b6670', 7.49], [glassBlock, 560, 1020, 'GLASS', '#2f8fd6', 8.15], [hingeBlock, 850, 1020, 'HINGES', '#d99a00', 8.75]]
  .map(([fn, x, y, l, c, at]) => { const w = g(s3); fn(w); sticker(w, fn === hingeBlock ? 0 : 70, fn === hingeBlock ? 80 : -140); const lb = pill(s3, l, c); SFX.push({ t: A(at), type: 'pop' }); return { w, lb, x, y, at: A(at), fn }; });
const CHIPS = [['PACKED', 190, 9.47], ['LABELLED', 530, 10.08], ['DELIVERED', 880, 10.77]].map(([t, x, at]) => { const p = pill(s3, '✓ ' + t, '#1fae5b'); SFX.push({ t: A(at), type: 'tick' }); return { p, x, at: A(at) }; });
SFX.push({ t: A(5.22), type: 'whoosh' }); SFX.push({ t: A(12.2), type: 'click' }); SFX.push({ t: A(12.8), type: 'ding' });
const tick = g(s3); add(tick, 'circle', { cx: 0, cy: 0, r: 70, fill: '#1fae5b' }); add(tick, 'path', { d: 'M-30,0 L-8,24 L34,-24', stroke: '#fff', 'stroke-width': 14, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });

/* ---------- captions ---------- */
const LINES = [
  [0.0, 2.33, 'Every morning, something’s missing.', { 2: 'k', 3: 'k' }],
  [2.83, 4.66, 'Unless someone packs the bag for you.', { 2: 'g' }],
  [5.22, 7.17, 'That’s what Razan does for your wardrobe:', { 2: 'b', 6: 'b' }],
  [7.49, 11.23, 'frame, glass and hinges — packed, labelled, delivered.', { 0: 'b', 1: 'b', 3: 'b', 5: 'g', 6: 'g', 7: 'g' }, [[7.49, 9.22], [9.47, 9.86], [10.08, 10.54], [10.77, 11.23]]],
];
const caps = LINES.map(([a, b, text, hl, segs]) => { const bx = document.createElement('div'); bx.style.cssText = 'position:absolute;left:0;right:0;top:0;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px';
  const words = text.split(' '); segs = segs || [[a, b]];
  const per = segs.map(() => []); { const tot = words.reduce((s, w) => s + w.length, 0); let acc = 0, si = 0, segTot = segs.reduce((s, [x, y]) => s + (y - x), 0), segAcc = segs[0][1] - segs[0][0];
    words.forEach(w => { if (acc / tot > segAcc / segTot + .02 && si < segs.length - 1) { si++; segAcc += segs[si][1] - segs[si][0]; } per[si].push(w); acc += w.length; }); }
  const spans = [], times = []; let wi = 0;
  per.forEach((ws, si) => { const [x, y] = segs[si], L = ws.reduce((s, w) => s + w.length + 2, 0); let acc = 0;
    ws.forEach(w => { const sp = document.createElement('span'); sp.className = 'w' + (hl[wi] ? ' ' + hl[wi] : ''); sp.textContent = w; bx.appendChild(sp); spans.push(sp); times.push(A(x + (y - x) * acc / L) - .05); acc += w.length + 2; wi++; }); });
  $('caps').appendChild(bx); return { box: bx, spans, times, a: A(a) - .1 }; });

const END = 17.4, DUR = 20;
const SLOT = [[400, 860], [600, 860], [800, 860]];      // where items sit above the bag in scene 1
window.render = t => {
  // SCENE 1 (0 – 3.0): MON / TUE / WED
  const s1o = 1 - easeInOut(prog(t, A(2.7), .4)); T(s1, 0, 0, 1, s1o);
  SHOPS.forEach((sh, i) => T(sh.s, sh.x, lerp(200, 300, easeBack(prog(t, .05 + i * .08, .4))), .9, clamp(prog(t, .05 + i * .08, .2))));
  const di = Math.max(0, DAYS.filter(d => t >= d.at).length - 1), day = DAYS[di];
  calTxt.textContent = day.d; T(cal, 540, 500, lerp(1.15, 1, easeOut(prog(t, day.at, .25))), clamp(prog(t, .2, .2)), lerp(-6, 0, easeOut(prog(t, day.at, .3))));
  T(bag1, 600, 1180, 1, clamp(prog(t, .1, .3)));
  DAYS.forEach((d, j) => fly[j].forEach((w, k) => { const on = j === di && k !== d.missing; const q = easeOut(prog(t, d.at + .05 + k * .12, .35));
    T(w, lerp(SHOPS[k].x, SLOT[k][0], q), lerp(330, SLOT[k][1], q), .8, on ? clamp(q * 3) : 0); }));
  miss.forEach((w, k) => { const on = k === day.missing; const q = prog(t, day.at + .4, .25); T(w, SLOT[k][0], SLOT[k][1], easeBack(q) * .9, on ? clamp(q * 2) : 0); });
  missP.forEach((w, k) => T(w, SLOT[k][0], 700, 1, k === day.missing ? clamp(prog(t, day.at + .45, .2)) : 0));
  // kid
  const sceneKid = t < A(11.4);
  const happy = t > A(2.9);
  T(kid, 200, 1340, 1, clamp(prog(t, .2, .3)) * (1 - prog(t, A(5.1), .3)) + clamp(prog(t, A(12.6), .4)) * (1 - prog(t, END, .3)));
  kMouth.setAttribute('d', happy ? 'M-18,-136 Q0,-114 18,-136' : 'M-18,-122 Q0,-138 18,-122');
  kArmL.setAttribute('d', 'M0,-70 L-50,-20');
  kArmR.setAttribute('d', happy ? 'M0,-70 L56,-150' : 'M0,-70 L50,-20');
  // SCENE 2 (2.8 – 5.2): packed bag arrives
  const s2o = clamp(prog(t, A(2.75), .3)) * (1 - easeInOut(prog(t, A(5.05), .35))); T(s2, 0, 0, 1, s2o);
  const arr = easeOut(prog(t, A(2.83), .7)); T(bag2, lerp(1300, 600, arr), 1180, 1, 1);
  packedItems.forEach((p, k) => { const q = easeBack(prog(t, A(3.1) + k * .15, .4)); T(p.w, 380 + k * 220, lerp(1180, 860, q), .8, clamp(prog(t, A(3.1) + k * .15, .15)));
    T(p.tg, 380 + k * 220, 1000, 1, clamp(prog(t, A(3.35) + k * .15, .2))); });
  T(readyP, 600, 1440, easeBack(prog(t, A(3.9), .4)), clamp(prog(t, A(3.9), .15)));
  // SCENE 3 (5.2 – end): Razan box -> FRAME / GLASS / HINGES -> packed, labelled, delivered -> wardrobe
  const s3o = clamp(prog(t, A(5.1), .35)) * (1 - prog(t, END, .3)); T(s3, 0, 0, 1, s3o);
  const slide = easeOut(prog(t, A(5.22), .7)); T(logoBlock, lerp(-400, 540, slide), 360, .8, 1);                // slides straight in — no roll
  T(box, 540, 700, easeBack(prog(t, A(5.9), .45)), clamp(prog(t, A(5.9), .2)) * (1 - prog(t, A(7.3), .3)));
  const snap = easeBack(prog(t, A(11.6), .5));

    T(p.w, x, y, (i === 2 ? 1.1 : .8) * lerp(.6, 1, q) * lerp(1, i === 2 ? .8 : 1, snap), clamp(prog(t, p.at, .15)));
    T(p.lb, p.x, 1340, 1, clamp(prog(t, p.at + .1, .2)) * (1 - prog(t, A(9.3), .3))); });
  CHIPS.forEach(c => T(c.p, c.x, 1360, easeBack(prog(t, c.at, .35)), clamp(prog(t, c.at, .15)) * (1 - prog(t, A(11.6), .3))));
  T(tick, 790, 760, easeBack(prog(t, A(12.6), .4)), clamp(prog(t, A(12.6), .15)));
  // captions
  caps.forEach((c, i) => { const nxt = i + 1 < caps.length ? caps[i + 1].a : END; c.box.style.display = t >= c.a && t < nxt ? 'flex' : 'none';
    c.spans.forEach((w, j) => { const p = prog(t, c.times[j], .25); w.style.opacity = clamp(p * 3); w.style.transform = `translateY(${lerp(18, 0, easeOut(p))}px)`; }); });
  // END CARD
  $('end').style.opacity = easeInOut(prog(t, END, .5));
  $('elogo').style.opacity = easeOut(prog(t, END + .15, .5));                                          // logo: fade only
  $('end').querySelectorAll('.l1,.l2,.btn,.url').forEach((n, i) => { const q = prog(t, END + .3 + i * .3, .4); n.style.opacity = q;
    n.style.transform = (n.classList.contains('btn') ? 'translateX(-50%) ' : '') + `translateY(${lerp(30, 0, easeOut(q))}px)`; });
};
window.SFX = SFX.sort((a, b) => a.t - b.t); window.CFG = { duration: DUR, voiceAt: OFF };
window.DURATION = DUR; window.AUDIO_OFFSET = 0; window.AUDIO = 'sb-x10-06-backpack.mp3';
const q = new URLSearchParams(location.search); window.render(q.has('t') ? +q.get('t') : 1); window.READY = true;
</script>
