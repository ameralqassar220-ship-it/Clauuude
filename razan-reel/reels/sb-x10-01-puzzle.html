<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Razan — x10 #1 "The Puzzle" (9:16, 20 s)</title>
<!-- Flat 2D, same style as sb-explainer. A wardrobe as a 4-piece jigsaw: three pieces from three boxes, the last one is the
     wrong shape and won't go in. Then Razan cuts every piece from one drawing: click, done. Narration: audio/x10/01-puzzle.mp3.
     Brand rule: the Razan logo never rolls or spins (logo block slides straight in; end-card logo only fades). -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: "Inter Display", Inter, sans-serif; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: linear-gradient(180deg, #dff1ff 0%, #f3f9ff 62%, #fff7e6 62.1%, #fff2d6 100%); }
  svg { position: absolute; left: 0; top: 0; }
  .lbl { font: 900 40px "Inter Display", Inter; letter-spacing: .06em; fill: #fff; }
  .shop { font: 900 30px Inter; fill: #fff; letter-spacing: .08em; }
  .small { font: 800 34px Inter; fill: #1d2b3a; }
  #caps { position: absolute; left: 60px; right: 60px; top: 1600px; font: 900 64px/1.15 "Inter Display", Inter; color: #1d2b3a; text-align: center; }
  .w { display: inline-block; } .w.k { color: #fff; background: #ff6b4a; padding: 0 14px 6px; border-radius: 14px; } .w.g { color: #fff; background: #1fae5b; padding: 0 14px 6px; border-radius: 14px; }
  .w.b { color: #fff; background: #00203f; padding: 0 14px 6px; border-radius: 14px; }
  #end { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, #0b3358 0%, #00203f 60%, #00142a 100%); color: #fff; opacity: 0; }
  #end .logo { position: absolute; left: 190px; top: 420px; width: 700px; height: 280px; border-radius: 34px; background: #fff url(../assets/logo.png) center/112% auto no-repeat; }
  #end .l1 { position: absolute; left: 0; right: 0; top: 820px; text-align: center; font: 900 100px/1.05 "Inter Display", Inter; }
  #end .l2 { position: absolute; left: 0; right: 0; top: 950px; text-align: center; font: 800 70px/1.1 "Inter Display", Inter; color: #DBAB88; }
  #end .btn { position: absolute; left: 50%; top: 1140px; padding: 34px 90px; border-radius: 999px; background: #25D366; font: 800 56px/1 Inter; white-space: nowrap; }
  #end .url { position: absolute; left: 0; right: 0; top: 1300px; text-align: center; font: 600 36px Inter; color: rgba(255,255,255,.8); }
</style>
</head>
<body>
<div id="stage">
  <svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <div id="caps"></div>
  <div id="end"><div class="logo" id="elogo"></div><div class="l1">Send your drawing.</div><div class="l2">Price in 2 hours.</div><div class="btn">Get a quote</div><div class="url">razanuae.com · WhatsApp +971 50 201 9281</div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeBack = p => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const prog = (t, a, d) => clamp((t - a) / d);
const OFF = 0.3, A = x => x + OFF;                 // narration starts 0.3 s in; beat times below are narration times
const DUR = 20, END = 17.3;                        // end card from 17.3 s
const NS = 'http://www.w3.org/2000/svg', S = $('s');
const SFX = [];
function g(parent = S) { const n = document.createElementNS(NS, 'g'); parent.appendChild(n); return n; }
function add(parent, tag, at, txt) { const n = document.createElementNS(NS, tag); for (const k in at) n.setAttribute(k, at[k]); if (txt != null) n.textContent = txt; parent.appendChild(n); return n; }
function T(n, x, y, s = 1, o = 1, r = 0) { n.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(2)}) scale(${s.toFixed(4)})`); n.style.opacity = o.toFixed(3); n.style.display = o <= .001 ? 'none' : ''; }
function pill(p, text, color) { const b = g(p); const w = text.length * 25 + 60;
  add(b, 'rect', { x: -w / 2, y: -34, width: w, height: 68, rx: 34, fill: color }); add(b, 'text', { x: 0, y: 13, 'text-anchor': 'middle', class: 'lbl' }, text); return b; }
const defs = add(S, 'defs', {});

/* ---------- jigsaw geometry: the wardrobe 280..800 x 420..1180, cut 2x2 at x=540 / y=800 ---------- */
// edge P->Q with an optional bump (unit vector) — a round tab/slot in the middle of the edge
function E(P, Q, b) {
  if (!b) return ` L${Q[0]},${Q[1]}`;
  const L = Math.hypot(Q[0] - P[0], Q[1] - P[1]), d = [(Q[0] - P[0]) / L, (Q[1] - P[1]) / L];
  const p1 = [P[0] + d[0] * .4 * L, P[1] + d[1] * .4 * L], p4 = [P[0] + d[0] * .6 * L, P[1] + d[1] * .6 * L];
  const h = .1 * L, p2 = [p1[0] + b[0] * h, p1[1] + b[1] * h], p3 = [p4[0] + b[0] * h, p4[1] + b[1] * h];
  const sweep = (b[0] === d[1] && b[1] === -d[0]) ? 1 : 0;
  return ` L${p1[0]},${p1[1]} L${p2[0]},${p2[1]} A${.12 * L},${.12 * L} 0 1 ${sweep} ${p3[0]},${p3[1]} L${p4[0]},${p4[1]} L${Q[0]},${Q[1]}`;
}
const P = (x, y) => [x, y];
const PIECES = {
  TL: `M280,420` + E(P(280, 420), P(540, 420)) + E(P(540, 420), P(540, 800), [1, 0]) + E(P(540, 800), P(280, 800), [0, 1]) + E(P(280, 800), P(280, 420)) + 'Z',
  TR: `M540,420` + E(P(540, 420), P(800, 420)) + E(P(800, 420), P(800, 800)) + E(P(800, 800), P(540, 800), [0, -1]) + E(P(540, 800), P(540, 420), [1, 0]) + 'Z',
  BL: `M280,800` + E(P(280, 800), P(540, 800), [0, 1]) + E(P(540, 800), P(540, 1180), [-1, 0]) + E(P(540, 1180), P(280, 1180)) + E(P(280, 1180), P(280, 800)) + 'Z',
  BR: `M540,800` + E(P(540, 800), P(800, 800), [0, -1]) + E(P(800, 800), P(800, 1180)) + E(P(800, 1180), P(540, 1180)) + E(P(540, 1180), P(540, 800), [-1, 0]) + 'Z',
  // the wrong one: tabs where slots should be — it can never sit flush
  BAD: `M540,800` + E(P(540, 800), P(800, 800), [0, 1]) + E(P(800, 800), P(800, 1180)) + E(P(800, 1180), P(540, 1180)) + E(P(540, 1180), P(540, 800), [1, 0]) + 'Z',
};
const CENTRE = { TL: [410, 610], TR: [670, 610], BL: [410, 990], BR: [670, 990], BAD: [670, 990] };
// the picture painted across the pieces: grey frame, two glass doors, yellow hinges
function art(p) {
  add(p, 'rect', { x: 280, y: 420, width: 520, height: 760, fill: '#8d99a6' });
  [[302, 442], [558, 442]].forEach(([x, y]) => { add(p, 'rect', { x, y, width: 220, height: 716, rx: 6, fill: '#6cc4ff', stroke: '#2f8fd6', 'stroke-width': 5 });
    for (let i = 1; i < 7; i++) add(p, 'line', { x1: x + i * 31, y1: y + 12, x2: x + i * 31, y2: y + 704, stroke: 'rgba(255,255,255,.35)', 'stroke-width': 4 });
    add(p, 'path', { d: `M${x + 24},${y + 70} l70,-40 v26 l-70,40 Z M${x + 24},${y + 150} l130,-76 v20 l-130,76 Z`, fill: 'rgba(255,255,255,.55)' }); });
  add(p, 'rect', { x: 530, y: 720, width: 8, height: 160, rx: 4, fill: '#f5b915' }); add(p, 'rect', { x: 542, y: 720, width: 8, height: 160, rx: 4, fill: '#f5b915' });
  [500, 1100].forEach(y => add(p, 'rect', { x: 268, y, width: 22, height: 54, rx: 6, fill: '#f5b915', stroke: '#c48c00', 'stroke-width': 3 }));
}
function piece(parent, key, stroke = '#1d2b3a') {
  const cp = add(defs, 'clipPath', { id: 'cp' + key + Math.random().toString(36).slice(2, 6) }); add(cp, 'path', { d: PIECES[key] });
  const outer = g(parent), inner = g(outer);                   // outer: placement; inner: shifts the piece so its centre is (0,0)
  const [cx, cy] = CENTRE[key]; inner.setAttribute('transform', `translate(${-cx} ${-cy})`);
  const pic = g(inner); pic.setAttribute('clip-path', `url(#${cp.id})`); art(pic);
  add(inner, 'path', { d: PIECES[key], fill: 'none', stroke, 'stroke-width': 6, 'stroke-linejoin': 'round' });
  return outer;
}

/* ---------- scene ---------- */
const outline = add(S, 'path', { d: PIECES.TL + PIECES.TR + PIECES.BL + PIECES.BR, fill: 'rgba(255,255,255,.55)', stroke: '#9bb8d3', 'stroke-width': 5, 'stroke-dasharray': '18 14' });
const titleLbl = add(S, 'text', { x: 540, y: 370, 'text-anchor': 'middle', class: 'small' }, 'Your wardrobe');
// three boxes
function box(p, c, label) { const b = g(p);
  add(b, 'path', { d: 'M-120,-60 L120,-60 L120,90 L-120,90 Z', fill: '#d9a066', stroke: '#8a5a2b', 'stroke-width': 5 });
  add(b, 'path', { d: 'M-120,-60 L-150,-100 L90,-100 L120,-60 Z M120,-60 L150,-100 L-90,-100', fill: '#c48a52', stroke: '#8a5a2b', 'stroke-width': 5 });
  add(b, 'rect', { x: -90, y: -10, width: 180, height: 56, rx: 10, fill: c }); add(b, 'text', { x: 0, y: 28, 'text-anchor': 'middle', class: 'shop' }, label); return b; }
const boxesG = g();
const BOXES = [[200, '#ff6b4a', 'SHOP 1'], [540, '#ff9f1c', 'SHOP 2'], [880, '#9b5de5', 'SHOP 3']].map(([x, c, l]) => ({ b: box(boxesG, c, l), x }));
// pieces from the shops (TL, TR, BL fit; BAD doesn't)
const shopPieces = g();
const FROM = [['TL', 0, 2.3], ['TR', 1, 3.1], ['BL', 2, 3.9]].map(([k, bi, at]) => { SFX.push({ t: A(at), type: 'whoosh' }); return { k, n: piece(shopPieces, k), bi, at: A(at) }; });
const bad = piece(shopPieces, 'BAD', '#e03131'); const BAD_AT = A(4.6); SFX.push({ t: BAD_AT, type: 'whoosh' });
const badP = pill(S, 'WRONG SHAPE', '#e03131');
const cross = g(); add(cross, 'circle', { cx: 0, cy: 0, r: 60, fill: '#e03131' }); add(cross, 'path', { d: 'M-24,-24 L24,24 M24,-24 L-24,24', stroke: '#fff', 'stroke-width': 12, 'stroke-linecap': 'round' });
SFX.push({ t: A(5.15), type: 'clunk' }); SFX.push({ t: A(5.75), type: 'clunk' });
// stick-figure customer
const cust = g();
add(cust, 'circle', { cx: 0, cy: -150, r: 46, fill: '#fff', stroke: '#1d2b3a', 'stroke-width': 8 });
const mouth = add(cust, 'path', { d: '', stroke: '#1d2b3a', 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round' });
add(cust, 'circle', { cx: -16, cy: -158, r: 6, fill: '#1d2b3a' }); add(cust, 'circle', { cx: 16, cy: -158, r: 6, fill: '#1d2b3a' });
add(cust, 'path', { d: 'M0,-104 V40 M0,40 L-40,140 M0,40 L40,140', stroke: '#1d2b3a', 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' });
const arms = add(cust, 'path', { d: '', stroke: '#1d2b3a', 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' });
const sweat = add(cust, 'path', { d: 'M40,-196 q10,16 0,24 q-10,-8 0,-24 Z', fill: '#6cc4ff' });
// Razan: logo block + the one drawing every piece is cut from
const logoBlock = g();
add(logoBlock, 'rect', { x: -230, y: -100, width: 460, height: 200, rx: 28, fill: '#fff', stroke: '#00203f', 'stroke-width': 6 });
add(logoBlock, 'image', { href: '../assets/logo.png', x: -235, y: -92, width: 470, height: 184, preserveAspectRatio: 'xMidYMid meet' });
for (let i = 0; i < 4; i++) add(logoBlock, 'rect', { x: -230 + (i + .5) * 115 - 22, y: -118, width: 44, height: 22, rx: 8, fill: '#e6ecf2' });
SFX.push({ t: A(6.3), type: 'whoosh' });
const sheet = g();
add(sheet, 'rect', { x: -230, y: -300, width: 460, height: 600, rx: 14, fill: '#1e5fa8' });
for (let i = 1; i < 12; i++) add(sheet, 'line', { x1: -230 + i * 38, y1: -300, x2: -230 + i * 38, y2: 300, stroke: 'rgba(255,255,255,.12)', 'stroke-width': 2 });
const sheetArt = g(sheet); sheetArt.setAttribute('transform', 'scale(.62) translate(-540 -800)');
add(sheetArt, 'path', { d: PIECES.TL + PIECES.TR + PIECES.BL + PIECES.BR, fill: 'none', stroke: '#fff', 'stroke-width': 6, 'stroke-dasharray': '16 10' });
add(sheet, 'text', { x: 0, y: 270, 'text-anchor': 'middle', style: 'font:800 30px "JetBrains Mono",monospace;fill:#cfe6ff' }, 'ONE DRAWING');
const goodG = g();
const GOOD = [['TL', 7.4], ['TR', 7.75], ['BL', 8.1], ['BR', 8.45]].map(([k, at]) => { SFX.push({ t: A(at), type: 'pop' }); return { k, n: piece(goodG, k, '#1fae5b'), at: A(at) }; });
SFX.push({ t: A(9.6), type: 'click' });
const seams = g(); { const cp = add(defs, 'clipPath', { id: 'wardclip' }); add(cp, 'rect', { x: 280, y: 420, width: 520, height: 760 }); seams.setAttribute('clip-path', 'url(#wardclip)'); }
const shine = add(seams, 'rect', { x: -200, y: 420, width: 120, height: 760, fill: 'rgba(255,255,255,.45)', transform: 'skewX(-15)' });
const tick = g(); add(tick, 'circle', { cx: 0, cy: 0, r: 70, fill: '#1fae5b' }); add(tick, 'path', { d: 'M-30,0 L-8,24 L34,-24', stroke: '#fff', 'stroke-width': 14, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
SFX.push({ t: A(10.1), type: 'ding' });
const pills = [['CUT FROM ONE DRAWING', 12.2, 1340], ['FITS THE FIRST TIME', 13.0, 1440]].map(([tx, at, y]) => { SFX.push({ t: A(at), type: 'tick' }); return { p: pill(S, tx, '#1fae5b'), at: A(at), y }; });

/* ---------- captions ---------- */
const LINES = [
  [0.0, 1.58, 'A wardrobe is a puzzle.', { 4: 'b' }],
  [2.01, 5.62, 'If the pieces come from different places, one of them never fits.', { 5: 'k', 6: 'k', 10: 'k', 11: 'k' }],
  [6.30, 9.90, 'We cut all the pieces from the same drawing, so they fit the first time.', { 7: 'g', 8: 'g', 11: 'g', 13: 'g', 14: 'g' }],
  [10.0, 10.9, 'Click. Done.', { 0: 'g', 1: 'g' }, [[10.0, 10.35], [10.55, 10.9]]],
];
const caps = LINES.map(([a, b, text, hl, segs]) => { const box = document.createElement('div'); box.style.cssText = 'position:absolute;left:0;right:0;top:0;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px';
  const words = text.split(' '); segs = segs || [[a, b]];
  const per = segs.map(() => []); { const tot = words.reduce((s, w) => s + w.length, 0); let acc = 0, si = 0, segTot = segs.reduce((s, [x, y]) => s + (y - x), 0), segAcc = segs[0][1] - segs[0][0];
    words.forEach(w => { if (acc / tot > segAcc / segTot + .02 && si < segs.length - 1) { si++; segAcc += segs[si][1] - segs[si][0]; } per[si].push(w); acc += w.length; }); }
  const spans = [], times = []; let wi = 0;
  per.forEach((ws, si) => { const [x, y] = segs[si], L = ws.reduce((s, w) => s + w.length + 2, 0); let acc = 0;
    ws.forEach(w => { const sp = document.createElement('span'); sp.className = 'w' + (hl[wi] ? ' ' + hl[wi] : ''); sp.textContent = w; box.appendChild(sp); spans.push(sp); times.push(A(x + (y - x) * acc / L) - .05); acc += w.length + 2; wi++; }); });
  $('caps').appendChild(box); return { box, spans, times, a: A(a) - .1 }; });

/* ---------- timeline ---------- */
window.render = t => {
  const before = 1 - easeInOut(prog(t, A(6.15), .45));          // the three-shop attempt
  outline.style.opacity = easeOut(prog(t, .2, .6)) * (1 - prog(t, A(9.4), .5)); titleLbl.style.opacity = easeOut(prog(t, .4, .6)) * before;
  T(boxesG, 0, 0, 1, clamp(prog(t, A(1.8), .4)) * before);
  BOXES.forEach((b, i) => T(b.b, b.x, lerp(1700, 1410, easeBack(prog(t, A(1.9) + i * .15, .5))), 1, 1));
  FROM.forEach(f => { const q = easeInOut(prog(t, f.at, .7)), [cx, cy] = CENTRE[f.k], bx = BOXES[f.bi].x;
    T(f.n, lerp(bx, cx, q), lerp(1380, cy, q) - Math.sin(Math.PI * q) * 160, lerp(.45, 1, q), clamp(prog(t, f.at, .15)) * before, lerp(-20, 0, q)); });
  // the wrong piece: arrives, the customer pushes, it bounces back twice
  const qa = easeInOut(prog(t, BAD_AT, .6)), p1 = prog(t, A(4.95), .25), b1 = prog(t, A(5.15), .3), p2 = prog(t, A(5.55), .25), b2 = prog(t, A(5.75), .35);
  const push = easeInOut(p1) * (1 - easeOut(b1)) + easeInOut(p2) * (1 - easeOut(b2));
  const bx = lerp(BOXES[1].x, 760, qa) - 60 * push, by = lerp(1380, 1000, qa) - Math.sin(Math.PI * qa) * 160;
  const jit = (b1 > 0 && b1 < 1 ? Math.sin(b1 * 30) * 8 * (1 - b1) : 0) + (b2 > 0 && b2 < 1 ? Math.sin(b2 * 30) * 8 * (1 - b2) : 0);
  T(bad, bx + jit, by, lerp(.45, 1.06, qa), clamp(prog(t, BAD_AT, .15)) * before, lerp(-20, 4, qa));
  T(badP, 760, 1245, easeBack(prog(t, A(5.2), .35)), clamp(prog(t, A(5.2), .15)) * before);
  T(cross, 780, 1000, easeBack(prog(t, A(5.3), .35)), clamp(prog(t, A(5.3), .15)) * before);
  // customer: pushes and sweats (before), then happy
  const happy = t > A(9.7), custO = clamp(prog(t, A(4.4), .4)) * before + clamp(prog(t, A(9.9), .4)) * (1 - prog(t, END, .3));
  T(cust, happy ? 950 : 990, happy ? 1330 : 1150, .9, custO);
  mouth.setAttribute('d', happy ? 'M-20,-136 Q0,-112 20,-136' : 'M-20,-120 Q0,-138 20,-120');
  arms.setAttribute('d', happy ? 'M0,-70 L60,-150 M0,-70 L-50,-30' : `M0,-70 L${(-70 - 20 * push).toFixed(1)},-90 M0,-60 L${(-70 - 20 * push).toFixed(1)},-50`);
  sweat.style.opacity = happy ? 0 : clamp(prog(t, A(5.2), .3));
  // Razan: logo block slides straight in, the one drawing appears, all four pieces come out of it and slot in
  const raz = clamp(prog(t, A(6.2), .3));
  T(logoBlock, lerp(-400, 540, easeOut(prog(t, A(6.3), .7))), 230, .62, raz * (1 - prog(t, END, .3)));
  const sheetQ = easeBack(prog(t, A(6.6), .5)), sheetOut = easeInOut(prog(t, A(9.0), .5));
  T(sheet, 540, lerp(820, 800, sheetQ), lerp(.7, 1, sheetQ) * lerp(1, .5, sheetOut), clamp(prog(t, A(6.6), .2)) * (1 - sheetOut));
  GOOD.forEach(p => { const q = easeInOut(prog(t, p.at, .6)), [cx, cy] = CENTRE[p.k];
    T(p.n, lerp(540, cx, q), lerp(800, cy, q), lerp(.4, 1, q), clamp(prog(t, p.at, .15)), 0); });
  // shine sweeps across the finished wardrobe
  const sh = prog(t, A(10.3), 1.1); shine.setAttribute('x', lerp(80, 1100, easeInOut(sh)).toFixed(1)); shine.style.opacity = sh > 0 && sh < 1 ? 1 : 0;
  T(tick, 860, 430, easeBack(prog(t, A(9.9), .4)), clamp(prog(t, A(9.9), .15)) * (1 - prog(t, END, .3)));
  pills.forEach(p => T(p.p, 540, p.y, easeBack(prog(t, p.at, .35)), clamp(prog(t, p.at, .15))));
  // captions: each line stays until the next one starts
  caps.forEach((c, i) => { const nxt = i + 1 < caps.length ? caps[i + 1].a : END; c.box.style.display = t >= c.a && t < nxt ? 'flex' : 'none';
    c.spans.forEach((w, j) => { const p = prog(t, c.times[j], .25); w.style.opacity = clamp(p * 3); w.style.transform = `translateY(${lerp(18, 0, easeOut(p))}px)`; }); });
  // end card
  $('end').style.opacity = easeInOut(prog(t, END, .5));
  $('elogo').style.opacity = easeOut(prog(t, END + .15, .5));                                      // logo: fade only
  $('end').querySelectorAll('.l1,.l2,.btn,.url').forEach((n, i) => { const q = prog(t, END + .3 + i * .35, .4); n.style.opacity = q;
    n.style.transform = (n.classList.contains('btn') ? 'translateX(-50%) ' : '') + `translateY(${lerp(30, 0, easeOut(q))}px)`; });
};
window.SFX = SFX.sort((a, b) => a.t - b.t); window.CFG = { duration: DUR, voiceAt: OFF };
window.DURATION = DUR; window.AUDIO_OFFSET = 0; window.AUDIO = 'sb-x10-01-puzzle.mp3';
const q = new URLSearchParams(location.search); window.render(q.has('t') ? +q.get('t') : 1); window.READY = true;
</script>
</body>
</html>
