<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Razan — ad 10 "The Promise" (flat 2D, 9:16, 15 s)</title>
<!-- Flat 2D series (see sb-explainer.html). Joinery owner and the Razan block shake hands; a contract scroll lists Cut to size / Drilled right / Delivered together. The Razan block slides straight in (never rotates); the logo only fades in on the end card. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: "Inter Display", Inter, sans-serif; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: linear-gradient(180deg, #dff1ff 0%, #f3f9ff 62%, #fff7e6 62.1%, #fff2d6 100%); }
  svg { position: absolute; left: 0; top: 0; }
  .lbl { font: 900 40px "Inter Display", Inter; letter-spacing: .06em; fill: #fff; }
  .small { font: 800 34px Inter; fill: #1d2b3a; }
  #caps { position: absolute; left: 60px; right: 60px; top: 1600px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px;
    font: 900 64px/1.15 "Inter Display", Inter; color: #1d2b3a; text-align: center; }
  .w { display: inline-block; } .w.k { color: #fff; background: #ff6b4a; padding: 0 14px 6px; border-radius: 14px; } .w.g { color: #fff; background: #1fae5b; padding: 0 14px 6px; border-radius: 14px; }
  .w.b { color: #fff; background: #00203f; padding: 0 14px 6px; border-radius: 14px; }
  #end { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, #0b3358 0%, #00203f 60%, #00142a 100%); color: #fff; opacity: 0; }
  #end .logo { position: absolute; left: 190px; top: 420px; width: 700px; height: 280px; border-radius: 34px; background: #fff url(../assets/logo.png) center/112% auto no-repeat; }
  #end .l1 { position: absolute; left: 0; right: 0; top: 820px; text-align: center; font: 900 100px/1.05 "Inter Display", Inter; }
  #end .l2 { position: absolute; left: 0; right: 0; top: 950px; text-align: center; font: 800 70px/1.1 "Inter Display", Inter; color: #DBAB88; }
  #end .btn { position: absolute; left: 50%; top: 1140px; padding: 34px 90px; border-radius: 999px; background: #25D366; font: 800 56px/1 Inter; white-space: nowrap; }
  #end .url { position: absolute; left: 0; right: 0; top: 1300px; text-align: center; font: 600 36px Inter; color: rgba(255,255,255,.8); }
</style>
</head>
<body>
<div id="stage">
  <svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <div id="caps"></div>
  <div id="end"><div class="logo" id="elogo"></div><div class="l1">Send your drawing.</div><div class="l2">Price in 2 hours.</div><div class="btn">Get a quote</div><div class="url">razanuae.com · WhatsApp +971 50 201 9281</div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeBack = p => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const prog = (t, a, d) => clamp((t - a) / d);
const OFF = 0.3, A = x => x + OFF;              // narration starts 0.3 s in; beat times below are narration times
const NS = 'http://www.w3.org/2000/svg', S = $('s');
const SFX = [];
function g(parent = S) { const n = document.createElementNS(NS, 'g'); parent.appendChild(n); return n; }
function add(parent, tag, at, txt) { const n = document.createElementNS(NS, tag); for (const k in at) n.setAttribute(k, at[k]); if (txt != null) n.textContent = txt; parent.appendChild(n); return n; }
function T(n, x, y, s = 1, o = 1, r = 0) { n.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(2)}) scale(${s.toFixed(4)})`); n.style.opacity = o.toFixed(3); n.style.display = o <= .001 ? 'none' : ''; }
function pill(p, text, color, y = 0) { const b = g(p); const w = text.length * 25 + 60;
  add(b, 'rect', { x: -w / 2, y: y - 34, width: w, height: 68, rx: 34, fill: color }); add(b, 'text', { x: 0, y: y + 13, 'text-anchor': 'middle', class: 'lbl' }, text); return b; }
// captions: [start, end, text, highlights, segments?] in narration time, word-by-word
function buildCaps(LINES) { return LINES.map(([a, b, text, hl, segs]) => { const box = document.createElement('div'); box.style.cssText = 'position:absolute;left:0;right:0;top:0;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px';
  const words = text.split(' '); segs = segs || [[a, b]];
  const per = segs.map(() => []); { const tot = words.reduce((s, w) => s + w.length, 0); let acc = 0, si = 0, segTot = segs.reduce((s, [x, y]) => s + (y - x), 0), segAcc = segs[0][1] - segs[0][0];
    words.forEach(w => { if (acc / tot > segAcc / segTot + .02 && si < segs.length - 1) { si++; segAcc += segs[si][1] - segs[si][0]; } per[si].push(w); acc += w.length; }); }
  const spans = [], times = []; let wi = 0;
  per.forEach((ws, si) => { const [x, y] = segs[si], L = ws.reduce((s, w) => s + w.length + 2, 0); let acc = 0;
    ws.forEach(w => { const sp = document.createElement('span'); sp.className = 'w' + (hl[wi] ? ' ' + hl[wi] : ''); sp.textContent = w; box.appendChild(sp); spans.push(sp); times.push(A(x + (y - x) * acc / L) - .05); acc += w.length + 2; wi++; }); });
  $('caps').appendChild(box); return { box, spans, times, a: A(a) - .1 }; }); }
function renderCaps(caps, t, endAt) { caps.forEach((c, i) => { const nxt = i + 1 < caps.length ? caps[i + 1].a : endAt; c.box.style.display = t >= c.a && t < nxt ? 'flex' : 'none';
  c.spans.forEach((w, j) => { const p = prog(t, c.times[j], .25); w.style.opacity = clamp(p * 3); w.style.transform = `translateY(${lerp(18, 0, easeOut(p))}px)`; }); }); }
function renderEnd(t, at) { const e = easeInOut(prog(t, at, .5)); $('end').style.opacity = e;
  $('elogo').style.opacity = easeOut(prog(t, at + .15, .5));                                     // logo: fade only, never moves
  $('end').querySelectorAll('.l1,.l2,.btn,.url').forEach((n, i) => { const q = prog(t, at + .25 + i * .35, .4); n.style.opacity = q;
    n.style.transform = (n.classList.contains('btn') ? 'translateX(-50%) ' : '') + `translateY(${lerp(30, 0, easeOut(q))}px)`; }); }
// stick figure (centred on hips); returns {root, mouth, armR}
function stick(p, color = '#1d2b3a') { const root = g(p);
  add(root, 'circle', { cx: 0, cy: -150, r: 46, fill: '#fff', stroke: color, 'stroke-width': 8 });
  const mouth = add(root, 'path', { d: 'M-20,-136 Q0,-112 20,-136', stroke: color, 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round' });
  add(root, 'circle', { cx: -16, cy: -158, r: 6, fill: color }); add(root, 'circle', { cx: 16, cy: -158, r: 6, fill: color });
  add(root, 'path', { d: 'M0,-104 V40 M0,40 L-40,140 M0,40 L40,140 M0,-70 L-46,-30', stroke: color, 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' });
  const armR = add(root, 'path', { d: 'M0,-70 L46,-30', stroke: color, 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' });
  return { root, mouth, armR }; }
/* Ad 10 "The Promise" — narration audio/x10/10-promise.mp3:
   0.00–1.26 "A promise is simple." · 1.89–2.73 "Cut to size." · 3.09–3.83 "Drilled right." · 4.23–5.32 "Delivered together."
   5.94–6.57 "Shake on it —" · 6.93–7.81 "with Razan." */
// contract scroll
const scroll = g(); const sheet = g(scroll);
const paperR = add(sheet, 'rect', { x: -380, y: 0, width: 760, height: 0, fill: '#fffaf0', stroke: '#c9b48f', 'stroke-width': 5 });
const topRoll = add(scroll, 'rect', { x: -400, y: -30, width: 800, height: 60, rx: 30, fill: '#DBAB88', stroke: '#b9845f', 'stroke-width': 5 });
const botRoll = add(scroll, 'rect', { x: -400, y: -30, width: 800, height: 60, rx: 30, fill: '#DBAB88', stroke: '#b9845f', 'stroke-width': 5 });
const content = g(scroll);
add(content, 'text', { x: 0, y: 90, 'text-anchor': 'middle', style: 'font:900 54px "Inter Display";fill:#00203f;letter-spacing:.08em' }, 'OUR PROMISE');
add(content, 'line', { x1: -300, y1: 120, x2: 300, y2: 120, stroke: '#DBAB88', 'stroke-width': 4 });
const LINES3 = ['Cut to size.', 'Drilled right.', 'Delivered together.'].map((txt, i) => { const r = g(content);
  add(r, 'circle', { cx: -290, cy: 0, r: 30, fill: '#1fae5b' }); add(r, 'path', { d: 'M-304,0 L-294,11 L-274,-12', stroke: '#fff', 'stroke-width': 8, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  const tx = add(r, 'text', { x: -240, y: 18, style: 'font:800 62px "Inter Display";fill:#1d2b3a' }, ''); return { r, tx, txt, y: 210 + i * 110 }; });
const sig = g(content);
add(sig, 'line', { x1: -320, y1: 0, x2: -40, y2: 0, stroke: '#1d2b3a', 'stroke-width': 3 }); add(sig, 'line', { x1: 40, y1: 0, x2: 320, y2: 0, stroke: '#1d2b3a', 'stroke-width': 3 });
add(sig, 'text', { x: -180, y: 40, 'text-anchor': 'middle', style: 'font:700 28px Inter;fill:#5b6670' }, 'Joinery owner'); add(sig, 'text', { x: 180, y: 40, 'text-anchor': 'middle', style: 'font:700 28px Inter;fill:#5b6670' }, 'Razan');
const sign1 = add(sig, 'path', { d: 'M-300,-10 C-270,-60 -250,20 -220,-25 S-160,-40 -130,-12 S-90,-30 -60,-15', stroke: '#2f8fd6', 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round' });
const sign2 = add(sig, 'path', { d: 'M60,-12 C90,-55 110,15 140,-28 S200,-38 230,-10 S270,-30 300,-18', stroke: '#2f8fd6', 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round' });
[sign1, sign2].forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.L = L; });
const stamp = g(); add(stamp, 'rect', { x: -150, y: -50, width: 300, height: 100, rx: 16, fill: 'rgba(255,255,255,.85)', stroke: '#1fae5b', 'stroke-width': 8 });
add(stamp, 'text', { x: 0, y: 18, 'text-anchor': 'middle', style: 'font:900 50px "Inter Display";fill:#1fae5b;letter-spacing:.06em' }, 'AGREED ✓');
// joinery owner
const owner = stick(S); add(owner.root, 'text', { x: 0, y: 200, 'text-anchor': 'middle', class: 'small' }, 'Joinery owner');
add(owner.root, 'path', { d: 'M-54,-186 h108 l-20,-36 h-68 Z', fill: '#f5b915', stroke: '#c48c00', 'stroke-width': 5 });   // hard hat
// Razan block: sand block with the logo card, studs, stick legs + arm (slides straight in — never rotates)
const blk = g();
[-80, 0, 80].forEach(x => add(blk, 'rect', { x: x - 26, y: -150, width: 52, height: 26, rx: 9, fill: '#e8c4a6' }));
add(blk, 'rect', { x: -140, y: -128, width: 280, height: 230, rx: 26, fill: '#DBAB88', stroke: '#b9845f', 'stroke-width': 6 });
add(blk, 'rect', { x: -118, y: -100, width: 236, height: 120, rx: 14, fill: '#fff' });
add(blk, 'image', { href: '../assets/logo.png', x: -118, y: -100, width: 236, height: 120, preserveAspectRatio: 'xMidYMid meet' });
add(blk, 'circle', { cx: -40, cy: 58, r: 9, fill: '#00203f' }); add(blk, 'circle', { cx: 40, cy: 58, r: 9, fill: '#00203f' });
add(blk, 'path', { d: 'M-22,74 Q0,92 22,74', stroke: '#00203f', 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round' });
add(blk, 'path', { d: 'M-60,102 L-80,190 M60,102 L80,190', stroke: '#1d2b3a', 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' });
add(blk, 'text', { x: 0, y: 250, 'text-anchor': 'middle', class: 'small' }, 'Razan');
const armO = add(S, 'path', { d: '', stroke: '#1d2b3a', 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' });
const armB = add(S, 'path', { d: '', stroke: '#1d2b3a', 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' });
const hand = add(S, 'circle', { cx: 0, cy: 0, r: 22, fill: '#DBAB88', stroke: '#1d2b3a', 'stroke-width': 5 });
const sparks = [0, 1, 2, 3, 4, 5].map(i => add(S, 'path', { d: 'M0,-14 L4,-4 L14,0 L4,4 L0,14 L-4,4 L-14,0 L-4,-4 Z', fill: i % 2 ? '#f5b915' : '#1fae5b' }));

const OX = 290, OY = 1330, BX = 800, BY = 1290, HX = 545, HY = 1200;
const LINE_AT = [1.89, 3.09, 4.23], MEET = 6.2, STAMP = 7.0;
SFX.push({ t: A(0.0), type: 'whoosh' }, { t: A(0.6), type: 'whoosh' });
LINE_AT.forEach(a => { for (let k = 0; k < 5; k++) SFX.push({ t: A(a) + k * .07, type: 'tick' }); SFX.push({ t: A(a), type: 'pop' }); });
SFX.push({ t: A(MEET), type: 'click' }, { t: A(MEET) + .3, type: 'pop' }, { t: A(STAMP), type: 'ding' });

const caps = buildCaps([
  [0.0, 1.26, 'A promise is simple.', { 1: 'b' }],
  [1.89, 5.32, 'Cut to size. Drilled right. Delivered together.', { 2: 'g', 4: 'g', 6: 'g' }, [[1.89, 2.73], [3.09, 3.83], [4.23, 5.32]]],
  [5.94, 7.81, 'Shake on it — with Razan.', { 0: 'b', 5: 'b' }, [[5.94, 6.57], [6.93, 7.81]]],
]);
const END = 12.4, DUR = 15.0;

window.render = t => {
  // scroll unrolls
  const un = easeInOut(prog(t, A(0.05), 1.1)), H = 760 * un;
  T(scroll, 540, 250, 1, clamp(prog(t, 0, .2)));
  paperR.setAttribute('height', H.toFixed(1)); botRoll.setAttribute('y', (H - 30).toFixed(1));
  content.style.opacity = clamp(prog(t, A(0.7), .4));
  LINES3.forEach((l, i) => { const a = A(LINE_AT[i]), n = Math.round(l.txt.length * prog(t, a, .45));
    l.tx.textContent = l.txt.slice(0, n); T(l.r, 40, l.y, 1, clamp(prog(t, a - .05, .1)));
    l.r.querySelector('circle').setAttribute('r', (30 * easeBack(prog(t, a, .3))).toFixed(1)); });
  T(sig, 0, 650, 1, clamp(prog(t, A(5.6), .3)));
  [sign1, sign2].forEach((p, i) => p.style.strokeDashoffset = +p.dataset.L * (1 - easeInOut(prog(t, A(MEET) + .4 + i * .35, .5))));
  T(stamp, 760, 860, lerp(1.8, 1, easeOut(prog(t, A(STAMP), .25))), clamp(prog(t, A(STAMP), .12)), -10);
  // characters
  T(owner.root, OX, OY, 1, clamp(prog(t, A(0.2), .4)));
  const slide = easeOut(prog(t, A(0.6), .8)); const bx = lerp(1300, BX, slide);
  T(blk, bx, BY, 1, 1);                                                                    // straight slide, no rotation
  // handshake: hands meet on "Shake on it", then shake
  const reach = easeInOut(prog(t, A(MEET) - .5, .5)), shake = t > A(MEET) ? Math.sin((t - A(MEET)) * 16) * 16 * Math.max(0, 1 - (t - A(MEET)) / 1.4) : 0;
  const so = [OX + 0, OY - 70], sb = [bx - 140, BY - 10];
  const hoRest = [OX + 46, OY - 30], hbRest = [bx - 180, BY + 40];
  const ho = [lerp(hoRest[0], HX - 18, reach), lerp(hoRest[1], HY, reach) + shake], hb = [lerp(hbRest[0], HX + 18, reach), lerp(hbRest[1], HY, reach) + shake];
  owner.armR.setAttribute('d', '');
  armO.setAttribute('d', `M${so[0]},${so[1]} L${ho[0].toFixed(1)},${ho[1].toFixed(1)}`); armO.style.opacity = clamp(prog(t, A(0.2), .4));
  armB.setAttribute('d', `M${sb[0].toFixed(1)},${sb[1]} L${hb[0].toFixed(1)},${hb[1].toFixed(1)}`);
  hand.setAttribute('cx', ((ho[0] + hb[0]) / 2).toFixed(1)); hand.setAttribute('cy', ((ho[1] + hb[1]) / 2).toFixed(1)); hand.style.opacity = reach > .95 ? 1 : 0;
  sparks.forEach((sp, i) => { const q = prog(t, A(MEET) + .05, .7), a = i * Math.PI / 3, r = lerp(30, 150, easeOut(q));
    T(sp, HX + Math.cos(a) * r, HY + Math.sin(a) * r, lerp(.4, 1.3, q), q > 0 && q < 1 ? 1 - q * .8 : 0); });
  renderCaps(caps, t, END);
  renderEnd(t, END);
};
window.SFX = SFX.sort((a, b) => a.t - b.t); window.CFG = { duration: DUR, voiceAt: OFF };
window.DURATION = DUR; window.AUDIO_OFFSET = 0; window.AUDIO = 'sb-x10-10-promise.mp3';
const qs = new URLSearchParams(location.search); window.render(qs.has('t') ? +qs.get('t') : 5); window.READY = true;
</script>
</body>
</html>
