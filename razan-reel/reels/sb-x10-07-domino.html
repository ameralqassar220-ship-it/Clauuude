<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Razan — "The Domino" (9:16, 15 s)</title>
<!-- Flat 2D series ad 7. Two domino rows DRAWING → CUT → DRILL → GLASS → LABEL → DELIVER → INSTALL.
     Top: one step missing, the chain stops. Bottom: Razan, one roof, all seven fall in one smooth run.
     Narration audio/x10/07-domino.mp3 (times below = that file). Logo never rolls/spins/scales. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: "Inter Display", Inter, sans-serif; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: linear-gradient(180deg, #dff1ff 0%, #f3f9ff 62%, #fff7e6 62.1%, #fff2d6 100%); }
  svg { position: absolute; left: 0; top: 0; }
  .lbl { font: 900 40px "Inter Display", Inter; letter-spacing: .06em; fill: #fff; }
  .dl { font: 900 30px Inter; letter-spacing: .08em; }
  .sec { font: 900 44px "Inter Display", Inter; }
  #caps { position: absolute; left: 60px; right: 60px; top: 1600px; }
  .w { display: inline-block; } .w.k { color: #fff; background: #ff6b4a; padding: 0 14px 6px; border-radius: 14px; } .w.g { color: #fff; background: #1fae5b; padding: 0 14px 6px; border-radius: 14px; }
  .w.b { color: #fff; background: #00203f; padding: 0 14px 6px; border-radius: 14px; }
  #end { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, #0b3358 0%, #00203f 60%, #00142a 100%); color: #fff; opacity: 0; }
  #end .logo { position: absolute; left: 190px; top: 420px; width: 700px; height: 280px; border-radius: 34px; background: #fff url(../assets/logo.png) center/112% auto no-repeat; }
  #end .l1 { position: absolute; left: 0; right: 0; top: 820px; text-align: center; font: 900 100px/1.05 "Inter Display", Inter; }
  #end .l2 { position: absolute; left: 0; right: 0; top: 950px; text-align: center; font: 800 70px/1.1 "Inter Display", Inter; color: #DBAB88; }
  #end .btn { position: absolute; left: 50%; top: 1140px; padding: 34px 90px; border-radius: 999px; background: #25D366; font: 800 56px/1 Inter; white-space: nowrap; }
  #end .url { position: absolute; left: 0; right: 0; top: 1300px; text-align: center; font: 600 36px Inter; color: rgba(255,255,255,.8); }
</style>
</head>
<body>
<div id="stage">
  <svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <div id="caps"></div>
  <div id="end"><div class="logo" id="elogo"></div><div class="l1">Send your drawing.</div><div class="l2">Price in 2 hours.</div><div class="btn">Get a quote</div><div class="url">razanuae.com · WhatsApp +971 50 201 9281</div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeIn = p => p * p;
const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeBack = p => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const prog = (t, a, d) => clamp((t - a) / d);
const OFF = 0.3, A = x => x + OFF;
const NS = 'http://www.w3.org/2000/svg', S = $('s');
const SFX = [];
const DUR = 15.0;
function g(parent = S) { const n = document.createElementNS(NS, 'g'); parent.appendChild(n); return n; }
function add(parent, tag, at, txt) { const n = document.createElementNS(NS, tag); for (const k in at) n.setAttribute(k, at[k]); if (txt != null) n.textContent = txt; parent.appendChild(n); return n; }
function T(n, x, y, s = 1, o = 1, r = 0) { n.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(2)}) scale(${s.toFixed(4)})`); n.style.opacity = o.toFixed(3); n.style.display = o <= .001 ? 'none' : ''; }
function pill(p, text, color) { const b = g(p); const w = text.length * 25 + 60;
  add(b, 'rect', { x: -w / 2, y: -34, width: w, height: 68, rx: 34, fill: color }); add(b, 'text', { x: 0, y: 13, 'text-anchor': 'middle', class: 'lbl' }, text); return b; }

/* ---------- dominoes ---------- */
const STEPS = ['DRAWING', 'CUT', 'DRILL', 'GLASS', 'LABEL', 'DELIVER', 'INSTALL'];
const DW = 78, DH = 300, GAP = 140, X0 = 40;            // domino width/height, spacing, first x (bottom-left)
const LEAN = Math.asin((GAP - DW) / DH) * 180 / Math.PI;  // angle at which a domino rests on the next one
// a domino is drawn with its pivot (bottom-right corner) at 0,0, body extending left/up
function domino(p, label, color) { const d = g(p);
  add(d, 'rect', { x: -DW, y: -DH, width: DW, height: DH, rx: 14, fill: '#fff', stroke: color, 'stroke-width': 7 });
  add(d, 'line', { x1: -DW + 14, y1: -DH / 2 - 70, x2: -14, y2: -DH / 2 - 70, stroke: color, 'stroke-width': 4 });
  add(d, 'circle', { cx: -DW / 2, cy: -DH + 34, r: 10, fill: color }); add(d, 'circle', { cx: -DW / 2, cy: -DH / 2 - 108, r: 10, fill: color });
  add(d, 'text', { x: -DW / 2 + 11, y: -DH / 2 + 50, 'text-anchor': 'middle', class: 'dl', fill: color, transform: `rotate(-90 ${-DW / 2 + 11} ${-DH / 2 + 50})` }, label);
  return d; }
// row A (no Razan): GLASS missing
const rowA = g(), rowB = g();
const BASE_A = 600, BASE_B = 1360;
add(rowA, 'rect', { x: 40, y: BASE_A, width: 1000, height: 14, rx: 7, fill: '#c9d3dd' });
add(rowB, 'rect', { x: 40, y: BASE_B, width: 1000, height: 14, rx: 7, fill: '#c9d3dd' });
const secA = add(S, 'text', { x: 540, y: BASE_A - DH - 70, 'text-anchor': 'middle', class: 'sec', fill: '#1d2b3a' }, 'Three suppliers');
const MISSING = 3;
const domA = STEPS.map((s, i) => i === MISSING ? null : domino(rowA, s, '#5b6670'));
const gap = g(rowA); add(gap, 'rect', { x: -DW, y: -DH, width: DW, height: DH, rx: 14, fill: 'rgba(255,107,74,.12)', stroke: '#ff6b4a', 'stroke-width': 6, 'stroke-dasharray': '16 12' });
add(gap, 'text', { x: -DW / 2, y: -DH / 2 + 26, 'text-anchor': 'middle', style: 'font:900 80px Inter;fill:#ff6b4a' }, '?');
const stopP = pill(S, 'STOPPED', '#ff6b4a');
// row B (Razan): all seven, under one roof
const roof = g();
add(roof, 'path', { d: 'M40,0 L540,-150 L1040,0 L1040,40 L40,40 Z', fill: '#00203f' });
add(roof, 'text', { x: 540, y: 18, 'text-anchor': 'middle', style: 'font:800 32px Inter;fill:#DBAB88;letter-spacing:.18em' }, 'ONE ROOF');
const logoBlock = g(roof);
add(logoBlock, 'rect', { x: -130, y: -60, width: 260, height: 112, rx: 20, fill: '#fff', stroke: '#DBAB88', 'stroke-width': 5 });
add(logoBlock, 'image', { href: '../assets/logo.png', x: -132, y: -56, width: 264, height: 104, preserveAspectRatio: 'xMidYMid meet' });
const domB = STEPS.map(s => domino(rowB, s, '#00203f'));
// green end post the last domino rests on
const post = g(rowB); add(post, 'rect', { x: 0, y: -210, width: 44, height: 210, rx: 12, fill: '#1fae5b' });
const tick = g(); add(tick, 'circle', { cx: 0, cy: 0, r: 64, fill: '#1fae5b' }); add(tick, 'path', { d: 'M-28,0 L-8,22 L30,-22', stroke: '#fff', 'stroke-width': 13, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
const neverP = pill(S, 'NEVER BREAKS', '#1fae5b');

/* ---------- timing (narration times + OFF) ---------- */
// "If one step is missing," 0–1.61 · "everything stops." 1.78–2.94 · "At Razan," 3.52–4.24 · "every step happens under one roof —" 4.43–6.47 · "so the chain never breaks." 6.73–8.2
const STOP = A(1.85), STEP_A = .2, START_A = STOP - 2 * STEP_A - .35;
const START_B = A(6.73), STEP_B = .24;
for (let i = 0; i < 3; i++) SFX.push({ t: START_A + i * STEP_A + .3, type: 'tick' });
SFX.push({ t: STOP, type: 'clunk' });
SFX.push({ t: A(3.52), type: 'whoosh' }); SFX.push({ t: A(4.5), type: 'whoosh' });
for (let i = 0; i < 7; i++) SFX.push({ t: START_B + i * STEP_B + .26, type: 'tick' });
const DONE_B = START_B + 7 * STEP_B + .35;
SFX.push({ t: DONE_B + .15, type: 'ding' });
const END = 12.3;

// fall angle of domino i in a chain starting at `start`; stopIdx: last one that falls (and falls into the gap)
function fall(t, i, start, step, n, flatLast) {
  const p = prog(t, start + i * step, .32);
  const target = (i === n - 1 && flatLast) ? 80 : LEAN;
  return easeIn(p) * target;
}

/* ---------- captions ---------- */
const LINES = [
  [0.0, 2.94, 'If one step is missing, everything stops.', { 4: 'k', 6: 'k' }, [[0, 1.61], [1.78, 2.94]]],
  [3.52, 8.2, 'At Razan, every step happens under one roof — so the chain never breaks.', { 1: 'b', 6: 'b', 7: 'b', 12: 'g', 13: 'g' }, [[3.52, 4.24], [4.43, 6.47], [6.73, 8.2]]],
];
const caps = LINES.map(([a, b, text, hl, segs]) => { const box = document.createElement('div'); box.style.cssText = 'position:absolute;left:0;right:0;top:0;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;font:900 64px/1.15 "Inter Display",Inter;color:#1d2b3a;text-align:center';
  const words = text.split(' '); segs = segs || [[a, b]];
  const per = segs.map(() => []); { const tot = words.reduce((s, w) => s + w.length, 0); let acc = 0, si = 0, segTot = segs.reduce((s, [x, y]) => s + (y - x), 0), segAcc = segs[0][1] - segs[0][0];
    words.forEach(w => { if (acc / tot > segAcc / segTot + .02 && si < segs.length - 1) { si++; segAcc += segs[si][1] - segs[si][0]; } per[si].push(w); acc += w.length; }); }
  const spans = [], times = []; let wi = 0;
  per.forEach((ws, si) => { const [x, y] = segs[si], L = ws.reduce((s, w) => s + w.length + 2, 0); let acc = 0;
    ws.forEach(w => { const sp = document.createElement('span'); sp.className = 'w' + (hl[wi] ? ' ' + hl[wi] : ''); sp.textContent = w; box.appendChild(sp); spans.push(sp); times.push(A(x + (y - x) * acc / L) - .05); acc += w.length + 2; wi++; }); });
  $('caps').appendChild(box); return { box, spans, times, a: A(a) - .1 }; });

window.render = t => {
  // ROW A
  const aIn = easeOut(prog(t, 0.05, .5));
  T(rowA, 0, lerp(60, 0, aIn), 1, aIn);
  secA.style.opacity = aIn;
  domA.forEach((d, i) => { if (!d) return; const x = X0 + i * GAP + DW;
    const r = i < MISSING ? fall(t, i, START_A, STEP_A, MISSING, true) : 0;
    const shake = i === MISSING - 1 ? Math.sin(prog(t, STOP, .5) * 30) * 3 * (1 - prog(t, STOP, .5)) * (t > STOP ? 1 : 0) : 0;
    T(d, x, BASE_A, 1, 1, r + shake); });
  T(gap, X0 + MISSING * GAP + DW, BASE_A, 1, clamp(prog(t, .4, .3)) * (0.65 + .35 * Math.abs(Math.sin(Math.max(0, t - STOP) * 5)) * (t > STOP ? 1 : 0)));
  T(stopP, X0 + MISSING * GAP + DW / 2, BASE_A + 80, easeBack(prog(t, STOP, .35)), clamp(prog(t, STOP, .15)));
  // ROW B
  const bIn = easeOut(prog(t, A(3.4), .5));
  T(rowB, 0, lerp(80, 0, bIn), 1, bIn);
  const roofIn = easeOut(prog(t, A(4.43), .6));
  T(roof, 0, lerp(BASE_B - DH - 420, BASE_B - DH - 70, roofIn), 1, clamp(prog(t, A(4.43), .2)));
  const slide = easeOut(prog(t, A(3.52), .7));
  T(logoBlock, lerp(-300, 540, slide), -140, 1, clamp(prog(t, A(3.52), .2)));   // slides straight in, no rotation
  domB.forEach((d, i) => { T(d, X0 + i * GAP + DW, BASE_B, 1, 1, fall(t, i, START_B, STEP_B, 7, false)); });
  T(post, X0 + 6 * GAP + DW + (GAP - DW), BASE_B, 1, 1);
  T(tick, 960, BASE_B - 390, easeBack(prog(t, DONE_B, .4)), clamp(prog(t, DONE_B, .15)));
  T(neverP, 540, BASE_B + 90, easeBack(prog(t, DONE_B + .1, .35)), clamp(prog(t, DONE_B + .1, .15)));
  // captions
  caps.forEach((c, i) => { const nxt = i + 1 < caps.length ? caps[i + 1].a : END; c.box.style.display = t >= c.a && t < nxt ? 'flex' : 'none';
    c.spans.forEach((w, j) => { const p = prog(t, c.times[j], .25); w.style.opacity = clamp(p * 3); w.style.transform = `translateY(${lerp(18, 0, easeOut(p))}px)`; }); });
  // END CARD
  $('end').style.opacity = easeInOut(prog(t, END, .5));
  $('elogo').style.opacity = easeOut(prog(t, END + .15, .5));                       // logo: fade only
  $('end').querySelectorAll('.l1,.l2,.btn,.url').forEach((n, i) => { const q = prog(t, END + .3 + i * .3, .4); n.style.opacity = q;
    n.style.transform = (n.classList.contains('btn') ? 'translateX(-50%) ' : '') + `translateY(${lerp(30, 0, easeOut(q))}px)`; });
};
window.SFX = SFX.sort((a, b) => a.t - b.t); window.CFG = { duration: DUR, voiceAt: OFF };
window.DURATION = DUR; window.AUDIO_OFFSET = 0; window.AUDIO = 'sb-x10-07-domino.mp3';
const q = new URLSearchParams(location.search); window.render(q.has('t') ? +q.get('t') : 1); window.READY = true;
</script>
</body>
</html>
