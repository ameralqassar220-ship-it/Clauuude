<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Razan x10 #3 — "The Phone Call" (9:16, 15 s)</title>
<!-- Flat 2D series (matches sb-explainer.html). Narration audio/x10/03-phone.mp3 (Douglas), times below = that file:
     0.0–3.7 "Three suppliers means three phone calls, three excuses," · 3.9–4.79 "three delays." ·
     5.48–7.73 "One drawing to Razan means one call —" · 8.11–9.48 "and one delivery."
     Brand rule: the Razan logo never rolls, spins or scales (fade only on the end card). -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: "Inter Display", Inter, sans-serif; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: linear-gradient(180deg, #dff1ff 0%, #f3f9ff 62%, #fff7e6 62.1%, #fff2d6 100%); }
  svg { position: absolute; left: 0; top: 0; }
  .lbl { font: 900 38px "Inter Display", Inter; letter-spacing: .06em; fill: #fff; }
  .small { font: 800 34px Inter; fill: #1d2b3a; }
  #caps { position: absolute; left: 60px; right: 60px; top: 1600px; }
  .w { display: inline-block; } .w.k { color: #fff; background: #ff6b4a; padding: 0 14px 6px; border-radius: 14px; } .w.g { color: #fff; background: #1fae5b; padding: 0 14px 6px; border-radius: 14px; }
  .w.b { color: #fff; background: #00203f; padding: 0 14px 6px; border-radius: 14px; }
  #end { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, #0b3358 0%, #00203f 60%, #00142a 100%); color: #fff; opacity: 0; }
  #end .logo { position: absolute; left: 190px; top: 420px; width: 700px; height: 280px; border-radius: 34px; background: #fff url(../assets/logo.png) center/112% auto no-repeat; }
  #end .l1 { position: absolute; left: 0; right: 0; top: 820px; text-align: center; font: 900 100px/1.05 "Inter Display", Inter; }
  #end .l2 { position: absolute; left: 0; right: 0; top: 950px; text-align: center; font: 800 70px/1.1 "Inter Display", Inter; color: #DBAB88; }
  #end .btn { position: absolute; left: 50%; top: 1140px; padding: 34px 90px; border-radius: 999px; background: #25D366; font: 800 56px/1 Inter; white-space: nowrap; }
  #end .url { position: absolute; left: 0; right: 0; top: 1300px; text-align: center; font: 600 36px Inter; color: rgba(255,255,255,.8); }
</style>
</head>
<body>
<div id="stage">
  <svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <div id="caps"></div>
  <div id="end"><div class="logo" id="elogo"></div><div class="l1">Send your drawing.</div><div class="l2">Price in 2 hours.</div><div class="btn">Get a quote</div><div class="url">razanuae.com · WhatsApp +971 50 201 9281</div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeBack = p => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const prog = (t, a, d) => clamp((t - a) / d);
const OFF = 0.3, A = x => x + OFF;
const NS = 'http://www.w3.org/2000/svg', S = $('s'), SFX = [];
const DUR = 15, END = 12.3;
function g(p = S) { const n = document.createElementNS(NS, 'g'); p.appendChild(n); return n; }
function add(p, tag, at, txt) { const n = document.createElementNS(NS, tag); for (const k in at) n.setAttribute(k, at[k]); if (txt != null) n.textContent = txt; p.appendChild(n); return n; }
function T(n, x, y, s = 1, o = 1, r = 0) { n.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(2)}) scale(${s.toFixed(4)})`); n.style.opacity = o.toFixed(3); n.style.display = o <= .001 ? 'none' : ''; }
function pill(p, text, color) { const b = g(p); const w = text.length * 24 + 60; add(b, 'rect', { x: -w / 2, y: -34, width: w, height: 68, rx: 34, fill: color }); add(b, 'text', { x: 0, y: 13, 'text-anchor': 'middle', class: 'lbl' }, text); return b; }

/* ---------- stick-figure owner ---------- */
function stick(p) { const c = g(p), o = {};
  add(c, 'circle', { cx: 0, cy: -150, r: 46, fill: '#fff', stroke: '#1d2b3a', 'stroke-width': 8 });
  add(c, 'circle', { cx: -16, cy: -158, r: 6, fill: '#1d2b3a' }); add(c, 'circle', { cx: 16, cy: -158, r: 6, fill: '#1d2b3a' });
  o.mouth = add(c, 'path', { stroke: '#1d2b3a', 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round' });
  o.sweat = add(c, 'path', { d: 'M52,-180 q10,18 0,26 q-10,-8 0,-26', fill: '#6cc4ff' });
  add(c, 'path', { d: 'M0,-104 V40 M0,40 L-40,140 M0,40 L40,140', stroke: '#1d2b3a', 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' });
  o.armL = add(c, 'path', { stroke: '#1d2b3a', 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' });
  o.armR = add(c, 'path', { stroke: '#1d2b3a', 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' });
  o.g = c; return o; }

/* ---------- part 1: three ringing desk phones, cords knotting ---------- */
const sc1 = g();
const PH = [[200, '#ff6b4a', 'GLASS'], [540, '#ff9f1c', 'PROFILES'], [880, '#9b5de5', 'HINGES']];
const cords = PH.map(() => add(sc1, 'path', { fill: 'none', stroke: '#1d2b3a', 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
const knot = add(sc1, 'path', { fill: 'none', stroke: '#1d2b3a', 'stroke-width': 7, 'stroke-linecap': 'round' });
{ let d = ''; for (let i = 0; i <= 60; i++) { const a = i * .55, r = 34 + 22 * Math.sin(i * 1.7); d += (i ? 'L' : 'M') + (540 + Math.cos(a) * r).toFixed(1) + ',' + (930 + Math.sin(a) * r * .8).toFixed(1); } knot.setAttribute('d', d); }
const phones = PH.map(([x, c, l], i) => { const p = g(sc1);
  add(p, 'path', { d: 'M-110,60 L-80,-20 H80 L110,60 Z', fill: c, stroke: '#1d2b3a', 'stroke-width': 6, 'stroke-linejoin': 'round' });
  for (let r = 0; r < 3; r++) for (let k = 0; k < 3; k++) add(p, 'circle', { cx: -30 + k * 30, cy: 8 + r * 16, r: 6, fill: 'rgba(255,255,255,.8)' });
  const hs = g(p); add(hs, 'path', { d: 'M-120,-40 q0,-36 40,-36 h160 q40,0 40,36 v10 h-50 v-10 h-140 v10 h-50 Z', fill: c, stroke: '#1d2b3a', 'stroke-width': 6, 'stroke-linejoin': 'round' });
  const ring = g(p); [0, 1, 2].forEach(k => { add(ring, 'path', { d: `M${-150 - k * 22},${-80 - k * 6} q-20,40 0,80`, stroke: c, 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round' });
    add(ring, 'path', { d: `M${150 + k * 22},${-80 - k * 6} q20,40 0,80`, stroke: c, 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round' }); });
  const lb = pill(sc1, l, c);
  SFX.push({ t: A(.15 + i * .55), type: 'ping' }); SFX.push({ t: A(.45 + i * .55), type: 'ping' });
  return { p, hs, ring, lb, x, at: A(.1 + i * .55) }; });
const EXC = [['Delayed!', 2.55], ['Out of stock', 2.95], ['Wrong size', 3.3]].map(([txt, at], i) => { const b = g(sc1); const w = txt.length * 21 + 50;
  add(b, 'rect', { x: -w / 2, y: -40, width: w, height: 80, rx: 26, fill: '#fff', stroke: '#1d2b3a', 'stroke-width': 5 });
  add(b, 'path', { d: 'M-14,38 L0,62 L14,38', fill: '#fff', stroke: '#1d2b3a', 'stroke-width': 5, 'stroke-linejoin': 'round' });
  add(b, 'text', { x: 0, y: 12, 'text-anchor': 'middle', style: 'font:800 34px Inter;fill:#e03131' }, txt); SFX.push({ t: A(at), type: 'pop' }); return { b, x: PH[i][0], at: A(at) }; });
const CLK = [3.95, 4.2, 4.45].map((at, i) => { const b = g(sc1); add(b, 'circle', { r: 40, fill: '#e03131' }); add(b, 'circle', { r: 29, fill: '#fff' });
  add(b, 'path', { d: 'M0,-19 V0 L13,9', stroke: '#e03131', 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round' }); SFX.push({ t: A(at), type: 'tick' }); return { b, x: PH[i][0], at: A(at) }; });
SFX.push({ t: A(4.6), type: 'clunk' });
const own1 = stick(sc1);

/* ---------- part 2: one phone, one WhatsApp thread ---------- */
const sc2 = g();
const phone = g(sc2);
add(phone, 'rect', { x: -230, y: -400, width: 460, height: 800, rx: 56, fill: '#1d2b3a' });
add(phone, 'rect', { x: -208, y: -376, width: 416, height: 752, rx: 40, fill: '#efeae2' });
add(phone, 'rect', { x: -208, y: -376, width: 416, height: 120, rx: 40, fill: '#008069' });
add(phone, 'rect', { x: -208, y: -300, width: 416, height: 44, fill: '#008069' });
add(phone, 'circle', { cx: -150, cy: -306, r: 34, fill: '#fff' });
add(phone, 'image', { href: '../assets/logo-mark.png', x: -180, y: -336, width: 60, height: 60 });
add(phone, 'text', { x: -100, y: -310, style: 'font:700 34px Inter;fill:#fff' }, 'Razan UAE');
add(phone, 'circle', { cx: 112, cy: -322, r: 14, fill: '#25D366' });
add(phone, 'text', { x: -100, y: -276, style: 'font:400 22px Inter;fill:#d8f3ec' }, 'Business account');
function bub(p, x, y, w, h, fill, lines, tail) { const b = g(p);
  add(b, 'rect', { x, y, width: w, height: h, rx: 18, fill, stroke: 'rgba(0,0,0,.08)', 'stroke-width': 2 });
  lines.forEach(([txt, st], i) => add(b, 'text', { x: x + 22, y: y + 48 + i * 42, style: st }, txt)); return b; }
const b1 = bub(phone, -40, -200, 230, 210, '#d9fdd3', [['📄', 'font:64px "Noto Color Emoji"'], ['', ''], ['Drawing sent', 'font:700 30px Inter;fill:#1d2b3a'], ['8:10  ✓✓', 'font:400 22px Inter;fill:#53bdeb']]);
const b2 = bub(phone, -190, 40, 330, 190, '#1fae5b', [['✓ Delivered', 'font:900 40px Inter;fill:#fff'], ['Frame · Glass · Hinges', 'font:600 26px Inter;fill:#eafff2'], ['', ''], ['Next day', 'font:400 22px Inter;fill:#d8fbe6']]);
const call = g(sc2); add(call, 'circle', { r: 56, fill: '#1fae5b' }); add(call, 'text', { x: 0, y: 22, 'text-anchor': 'middle', style: 'font:60px "Noto Color Emoji"' }, '📞');
const oneCall = pill(sc2, 'ONE CALL', '#1fae5b'), oneDel = pill(sc2, 'ONE DELIVERY', '#1fae5b');
const own2 = stick(sc2);
SFX.push({ t: A(5.5), type: 'whoosh' }); SFX.push({ t: A(6.0), type: 'pop' }); SFX.push({ t: A(6.95), type: 'ping' }); SFX.push({ t: A(8.15), type: 'ding' });

/* ---------- captions ---------- */
const LINES = [
  [[0.05, 3.70]], 'Three suppliers means three phone calls, three excuses,', { 0: 'k', 3: 'k', 6: 'k' },
  [[3.90, 4.79]], 'three delays.', { 0: 'k', 1: 'k' },
  [[5.48, 7.73]], 'One drawing to Razan means one call —', { 0: 'g', 1: 'g', 3: 'b', 5: 'g', 6: 'g' },
  [[8.11, 9.48]], 'and one delivery.', { 1: 'g', 2: 'g' },
];
const caps = [];
for (let i = 0; i < LINES.length; i += 3) { const [[a, b]] = LINES[i], text = LINES[i + 1], hl = LINES[i + 2];
  const box = document.createElement('div'); box.style.cssText = 'position:absolute;left:0;right:0;top:0;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;font:900 64px/1.15 "Inter Display",Inter;color:#1d2b3a';
  const ws = text.split(' '), L = ws.reduce((s, w) => s + w.length + 2, 0); let acc = 0; const spans = [], times = [];
  ws.forEach((w, j) => { const sp = document.createElement('span'); sp.className = 'w' + (hl[j] ? ' ' + hl[j] : ''); sp.textContent = w; box.appendChild(sp); spans.push(sp); times.push(A(a + (b - a) * acc / L) - .05); acc += w.length + 2; });
  $('caps').appendChild(box); caps.push({ box, spans, times, a: A(a) - .1 }); }

/* ---------- timeline ---------- */
window.render = t => {
  // part 1 (0 – 5.4)
  const o1 = 1 - easeInOut(prog(t, A(5.25), .45));
  T(sc1, 0, 0, 1, o1);
  const tangle = easeInOut(prog(t, A(2.4), 2.2));
  phones.forEach((p, i) => { const q = prog(t, p.at, .4), ringing = t > p.at && t < A(5.3);
    const sh = ringing ? Math.sin(t * 46 + i) * 4 : 0;
    T(p.p, p.x + sh, lerp(260, 420, easeBack(q)), .9, clamp(q * 2));
    p.hs.setAttribute('transform', `translate(0 ${ringing ? -Math.abs(Math.sin(t * 23 + i)) * 14 : 0})`);
    p.ring.style.opacity = ringing ? (Math.sin(t * 14 + i * 2) > 0 ? 1 : .25) : 0;
    T(p.lb, p.x, 535, 1, clamp(prog(t, p.at + .15, .3)));
    // cord from handset to the owner's ear, curling, then crossing into a knot
    const x0 = p.x, y0 = 390, x1 = 540 + [-60, 0, 60][i], y1 = 1180, kx = 540, ky = 930; let d = '';
    for (let k = 0; k <= 80; k++) { const u = k / 80;
      const bx = (1 - u) * (1 - u) * x0 + 2 * u * (1 - u) * lerp(x0, kx, tangle) + u * u * x1, by = (1 - u) * (1 - u) * y0 + 2 * u * (1 - u) * lerp(700, ky, tangle) + u * u * y1;
      const wig = Math.sin(u * 60 + i) * lerp(6, 14, tangle) + Math.sin(u * 13 + i * 2) * 40 * tangle * Math.sin(Math.PI * u);
      d += (k ? 'L' : 'M') + (bx + wig).toFixed(1) + ',' + (by + wig * .4).toFixed(1); }
    cords[i].setAttribute('d', d); cords[i].style.opacity = clamp(prog(t, p.at + .2, .4)); });
  knot.style.opacity = easeOut(prog(t, A(4.45), .4));
  knot.setAttribute('transform', `translate(540 930) scale(${lerp(.3, 1.15, easeBack(prog(t, A(4.45), .5)))}) translate(-540 -930)`);
  EXC.forEach(e => T(e.b, e.x, 210, easeBack(prog(t, e.at, .35)), clamp(prog(t, e.at, .15))));
  CLK.forEach(c => T(c.b, c.x + 120, 330, easeBack(prog(t, c.at, .35)), clamp(prog(t, c.at, .15))));
  T(own1.g, 540, 1400, 1, 1);
  own1.mouth.setAttribute('d', 'M-20,-120 Q0,-138 20,-120');
  own1.sweat.style.opacity = t > A(2.5) ? 1 : 0;
  const juggle = Math.sin(t * 9) * 12;
  own1.armL.setAttribute('d', `M0,-70 L-70,${-150 + juggle}`); own1.armR.setAttribute('d', `M0,-70 L70,${-150 - juggle}`);
  // part 2 (5.4 – 12.3)
  const o2 = easeInOut(prog(t, A(5.4), .5));
  T(sc2, 0, 0, 1, o2);
  const sl = easeOut(prog(t, A(5.48), .6));
  T(phone, lerp(-300, 450, sl), 820, 1, 1);
  T(b1, 0, lerp(30, 0, easeOut(prog(t, A(6.0), .35))), 1, clamp(prog(t, A(6.0), .2)));
  T(b2, 0, lerp(30, 0, easeOut(prog(t, A(8.15), .35))), 1, clamp(prog(t, A(8.15), .2)));
  T(call, 860, 560, easeBack(prog(t, A(6.95), .4)), clamp(prog(t, A(6.95), .2)));
  T(oneCall, 860, 680, easeBack(prog(t, A(7.05), .35)), clamp(prog(t, A(7.05), .2)));
  T(oneDel, 450, 1300, easeBack(prog(t, A(8.3), .35)), clamp(prog(t, A(8.3), .2)));
  T(own2.g, 870, 1380, .95, clamp(prog(t, A(5.9), .4)));
  const happy = t > A(8.1);
  own2.mouth.setAttribute('d', happy ? 'M-20,-136 Q0,-112 20,-136' : 'M-18,-128 L18,-128');
  own2.sweat.style.opacity = 0;
  own2.armL.setAttribute('d', 'M0,-70 L-46,-30'); own2.armR.setAttribute('d', happy ? 'M0,-70 L60,-150' : 'M0,-70 L46,-30');
  // captions
  caps.forEach((c, i) => { const nxt = i + 1 < caps.length ? caps[i + 1].a : A(END - .2); c.box.style.display = t >= c.a && t < nxt ? 'flex' : 'none';
    c.spans.forEach((w, j) => { const p = prog(t, c.times[j], .25); w.style.opacity = clamp(p * 3); w.style.transform = `translateY(${lerp(18, 0, easeOut(p))}px)`; }); });
  // end card
  $('end').style.opacity = easeInOut(prog(t, END, .5));
  $('elogo').style.opacity = easeOut(prog(t, END + .15, .5));                     // logo: fade only
  $('end').querySelectorAll('.l1,.l2,.btn,.url').forEach((n, i) => { const q = prog(t, END + .3 + i * .35, .4); n.style.opacity = q;
    n.style.transform = (n.classList.contains('btn') ? 'translateX(-50%) ' : '') + `translateY(${lerp(30, 0, easeOut(q))}px)`; });
};
window.SFX = SFX.sort((a, b) => a.t - b.t); window.CFG = { duration: DUR, voiceAt: OFF };
window.DURATION = DUR; window.AUDIO_OFFSET = 0; window.AUDIO = 'sb-x10-03-phone.mp3';
const q = new URLSearchParams(location.search); window.render(q.has('t') ? +q.get('t') : 1); window.READY = true;
</script>
</body>
</html>
